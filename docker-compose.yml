services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: modji
      POSTGRES_USER: modji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modji_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - modji-postgres:/var/lib/postgresql/data
      - ./infrastructure/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modji -d modji"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-modji_local_dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - modji-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  modji-postgres:
  modji-redis:
