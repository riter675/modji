name: MODJI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm mobile:typecheck
      - run: pnpm mobile:export
